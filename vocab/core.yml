# Plug Map core vocabulary: applies to every catalog category.
# Each term says how to recognise it:
#   dependencies       package names whose presence implies the term (any language)
#   weak_dependencies  indirect hints (e.g. xarray -> NetCDF); recorded but not counted as plugs
#   readme             case-insensitive regex matched line by line against the README
#   code               regexes for calls in source code, with the role they imply
#                      (reads | writes | speaks | pulls) and the languages they apply to
#   home_repos         repository names that ARE this term (so a tool never "uses" itself)
# kind: format | protocol | standard | source | ecosystem | generic
# Edit by pull request. Run `python -m plugmap validate` before committing.
layer: core
settings:
  ecosystem_usage_words: 'based on|built (on|with)|build on|\buses?\b|using|extends?|extension|interface|integrat|export|import|convert|compatib|wrapper|plug-?in|coupl|feeds?|input|output|works
    with|run with|powered by|on top of|requires|depends|format|\bfiles?\b|support|pars(e|ing|er)|\bread|\bwrit|\bload|\bsav(e|ing)'
terms:
- id: netcdf
  label: NetCDF
  kind: format
  dependencies:
  - netcdf4
  - h5netcdf
  - netcdf
  - ncdf4
  - rnetcdf
  - ncdatasets
  weak_dependencies:
  - xarray
  readme: '\bnetcdf\b'
  code:
  - role: reads
    languages:
    - python
    pattern: '\b(xr|xarray)\.(open_dataset|open_mfdataset|load_dataset|open_dataarray)\s*\(|netCDF4\.Dataset\s*\((?![^)]*[''\"](w|a)[''\"])'
  - role: reads
    languages:
    - julia
    pattern: '\bNCDataset\s*\((?![^)]*\"c\")'
  - role: reads
    languages:
    - r
    pattern: '\bnc_open\s*\('
  - role: writes
    languages:
    - python
    pattern: '\.to_netcdf\s*\(|netCDF4\.Dataset\s*\([^)]*[''\"](w|a)[''\"]'
  - role: writes
    languages:
    - julia
    pattern: '\bNCDataset\s*\([^)]*\"c\"'
  - role: writes
    languages:
    - r
    pattern: '\bnc_create\s*\('
  - role: reads
    languages:
    - c
    - cpp
    pattern: '\bnc_open(_par|_mem)?\s*\(|\bNcFile::read\b'
  - role: writes
    languages:
    - c
    - cpp
    pattern: '\bnc_create(_par|_mem)?\s*\(|\bNcFile::(replace|newFile|write)\b'
  - role: reads
    languages:
    - fortran
    pattern: '(?i)\bnf90_open\s*\((?![^)]*nf90_write)|\bnf_open\s*\((?![^)]*nf_write)'
  - role: writes
    languages:
    - fortran
    pattern: '(?i)\bnf90_create\s*\(|\bnf_create\s*\(|\bnf90_open\s*\([^)]*nf90_write|\bnf_open\s*\([^)]*nf_write'
  - role: reads
    languages:
    - java
    pattern: '\bNetcdfFiles?\.open(InMemory)?\s*\(|\bNetcdfDatasets?\.(open|acquire)(Dataset|File)?\s*\('
  - role: writes
    languages:
    - java
    pattern: '\bNetcdfFormatWriter\.(createNewNetcdf[34]|builder|openExisting)\s*\(|\bNetcdfFileWriter\.(createNew|openExisting)\s*\('
  - role: reads
    languages:
    - matlab
    pattern: '\bncread(att)?\s*\(|\bncinfo\s*\(|\bnetcdf\.open\s*\((?![^)]*WRITE)'
  - role: writes
    languages:
    - matlab
    pattern: '\bncwrite(att)?\s*\(|\bnccreate\s*\(|\bnetcdf\.create\s*\('
  - role: reads
    languages:
    - rust
    pattern: '\bnetcdf::open\w*\s*\('
  - role: writes
    languages:
    - rust
    pattern: '\bnetcdf::(create|append)\w*\s*\('
  - role: reads
    languages:
    - javascript
    - typescript
    pattern: '\bnew\s+NetCDFReader\s*\('
