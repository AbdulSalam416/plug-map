- id: messageix
  label: MESSAGEix / ixmp
  kind: ecosystem
  dependencies:
  - message-ix
  - message_ix
  - ixmp
  readme: 'messageix|message_ix|\bixmp\b'
  home_repos:
  - message-ix
  - message_ix
  - messageix
- id: entsoe
  label: ENTSO-E Transparency
  kind: source
  dependencies:
  - entsoe-py
  readme: entso-?e
  code:
  - role: pulls
    languages:
    - python
    pattern: '\bEntsoe(Pandas|Raw)Client\s*\('
  - role: pulls
    languages:
    - c
    - cpp
    - java
    - matlab
    - modelica
    - rust
    - javascript
    - typescript
    - fortran
    - python
    - julia
    - r
    pattern: 'transparency\.entsoe\.eu|web-api\.tp\.entsoe\.eu'
- id: eia
  label: US EIA
  kind: source
  dependencies:
  - eiapy
  - myeia
  readme: '\beia\b|energy information administration'
  code:
  - role: pulls
    languages:
    - julia
    - python
    - r
    pattern: 'api\.eia\.gov'
  - role: pulls
    languages:
    - c
    - cpp
    - java
    - matlab
    - modelica
    - rust
    - javascript
    - typescript
    - fortran
    pattern: 'api\.eia\.gov'
- id: pvgis
  label: PVGIS
  kind: source
  readme: '\bpvgis\b'
  code:
  - role: pulls
    languages:
    - julia
    - python
    - r
    pattern: 're\.jrc\.ec\.europa\.eu/api|\bget_pvgis_\w+\s*\('
  - role: pulls
    languages:
    - c
    - cpp
    - java
    - matlab
    - modelica
    - rust
    - javascript
    - typescript
    - fortran
    pattern: 're\.jrc\.ec\.europa\.eu/api'
- id: ninja
  label: Renewables.ninja
  kind: source
  readme: 'renewables\.ninja'
  code:
  - role: pulls
    languages:
    - julia
    - python
    - r
    pattern: 'renewables\.ninja/api'
  - role: pulls
    languages:
    - c
    - cpp
    - java
    - matlab
    - modelica
    - rust
    - javascript
    - typescript
    - fortran
    pattern: 'renewables\.ninja/api'
